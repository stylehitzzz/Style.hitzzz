<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Katalog produk toko online.">
  <title>Katalog Toko</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="search-wrap">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Cari nomor atau nama produk..." aria-label="Cari produk">
    </div>
    <div class="store">
      <div class="logo" id="logoText">TOKO</div>
      <div class="store-copy">
        <h1 id="storeName">NAMA TOKO</h1>
        <p id="storeTagline">Temukan produk pilihanmu. Klik produk untuk melihat link pembelian.</p>
      </div>
    </div>
  </header>

  <main>
    <nav class="categories" id="categories" aria-label="Kategori produk"></nav>
    <button class="more" id="moreButton" type="button">Lebih Banyak⌄</button>
    <section class="products" id="products" aria-label="Daftar produk"></section>
    <p class="empty" id="emptyMessage" hidden>Produk tidak ditemukan.</p>
  </main>

  <footer>
    <p id="footerName">NAMA TOKO</p>
    <small>Katalog produk • Klik foto untuk menuju link pembelian</small>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
