<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin style.hitzzz</title><link rel="stylesheet" href="admin.css"></head><body><main><header><a href="index.html">← Katalog</a><h1>style.hitzzz / Admin</h1></header><section id="login" class="panel"><h2>Login admin</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Masuk</button></form></section><section id="dashboard" class="panel" hidden><div class="bar"><h2>Tambah produk</h2><button type="button" id="logout" class="secondary">Keluar</button></div><form id="productForm"><label>Foto produk<input id="photo" type="file" accept="image/*" required></label><label>Nomor produk<input id="number" placeholder="001"></label><label>Nama produk<input id="name" required></label><label>Harga (angka)<input id="price" type="number" min="0" required></label><label>Kategori<select id="category" required><option value="">Pilih kategori</option><option>PAKAIAN PRIA</option><option>PAKAIAN WANITA</option><option>KAOS</option><option>KEMEJA</option><option>CELANA</option><option>JAKET & HOODIE</option><option>AKSESORIS OUTFIT</option><option>TAS</option><option>TOPI</option><option>SEPATU</option></select></label><label>Link Shopee<input id="shopee" type="url" placeholder="https://shopee.co.id/..." required></label><button id="save">Publikasikan produk</button></form><p id="message" role="status"></p><hr><h2>Produk tersimpan</h2><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
